[project]
name = "nutriai"
version = "1.0.0"
description = "AI-Based Personalized Diet Planning & Recommendation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pymongo>=4.6,<5.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.5,<3.0",
    "plotly>=5.18,<6.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
